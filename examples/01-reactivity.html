<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>① 响应式系统 · mini-vue</title>
    <style>
      body {
        font-family: -apple-system, "PingFang SC", sans-serif;
        max-width: 720px;
        margin: 40px auto;
        padding: 0 20px;
        color: #35495e;
      }
      h1 {
        color: #42b883;
      }
      .panel {
        background: #f6f8fa;
        border-radius: 10px;
        padding: 20px;
        margin: 16px 0;
      }
      button {
        background: #42b883;
        color: #fff;
        border: 0;
        padding: 8px 14px;
        border-radius: 6px;
        cursor: pointer;
        margin-right: 8px;
      }
      pre {
        background: #1e1e1e;
        color: #d4d4d4;
        padding: 14px;
        border-radius: 8px;
        overflow: auto;
        font-size: 13px;
      }
      a {
        color: #42b883;
      }
    </style>
  </head>
  <body>
    <p><a href="../index.html">← 返回首页</a></p>
    <h1>① 响应式系统</h1>
    <p>
      下面的数字、计算值、watch 日志都没有手动更新 DOM——它们都是 effect
      在数据变化时自动重新执行的结果。打开控制台还能看到 watch 的输出。
    </p>

    <div class="panel">
      <p>count = <b id="count"></b></p>
      <p>double (computed) = <b id="double"></b></p>
      <p>nested.user.name = <b id="name"></b></p>
      <button id="inc">count + 1</button>
      <button id="rename">改名字</button>
    </div>

    <h3>watch 日志</h3>
    <pre id="log"></pre>

    <script type="module">
      // 导入响应式系统的核心 API
      import { reactive, ref, computed, watch, effect } from "../src/index.js";

      // ---- reactive：创建响应式对象 ----
      // Proxy 拦截所有读写操作，包括嵌套对象的懒代理
      const state = reactive({
        count: 0,
        nested: { user: { name: "Vue" } },
      });

      // ---- computed：计算属性，依赖变化时才重新计算，且有缓存 ----
      // 内部是一个 lazy effect，第一次读 .value 才执行计算
      const double = computed(() => state.count * 2);

      // ---- 日志工具 ----
      const logEl = document.getElementById("log");
      const lines = [];
      function log(msg) {
        lines.unshift(msg);
        logEl.textContent = lines.slice(0, 8).join("\n");
      }

      // ---- effect：副作用函数 ----
      // 执行时会读取 state.count、double.value、state.nested.user.name，
      // 从而自动收集这三个依赖。当任一依赖变化时，effect 会自动重新执行，
      // 实现「数据变 → DOM 自动更新」。
      effect(() => {
        document.getElementById("count").textContent = state.count;
        document.getElementById("double").textContent = double.value;
        document.getElementById("name").textContent = state.nested.user.name;
      });

      // ---- watch：侦听特定数据的变化 ----
      // getter 函数：精确侦听 state.count
      watch(
        () => state.count,
        (newV, oldV) => log(`count: ${oldV} → ${newV}`)
      );

      // 深度 watch：侦听整个 reactive 对象，
      // traverse() 会递归访问所有属性以收集深层依赖
      watch(
        state,
        () => log("state（深度）发生了变化"),
        { immediate: false }
      );

      // ---- 事件绑定：修改响应式数据，触发上述自动更新 ----
      document.getElementById("inc").onclick = () => state.count++;
      document.getElementById("rename").onclick = () =>
        (state.nested.user.name =
          "Vue " + Math.floor(Math.random() * 100));
    </script>
  </body>
</html>
