<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>② 虚拟 DOM 渲染 · mini-vue</title>
    <style>
      body {
        font-family: -apple-system, "PingFang SC", sans-serif;
        max-width: 720px;
        margin: 40px auto;
        padding: 0 20px;
        color: #35495e;
      }
      h1 {
        color: #42b883;
      }
      button {
        background: #42b883;
        color: #fff;
        border: 0;
        padding: 8px 14px;
        border-radius: 6px;
        cursor: pointer;
        margin: 0 8px 8px 0;
      }
      ul {
        padding-left: 20px;
      }
      li {
        padding: 6px 10px;
        background: #f6f8fa;
        margin: 4px 0;
        border-radius: 6px;
        list-style: none;
      }
      a {
        color: #42b883;
      }
    </style>
  </head>
  <body>
    <p><a href="../index.html">← 返回首页</a></p>
    <h1>② 虚拟 DOM 渲染</h1>
    <p>
      这个组件用 <code>h()</code> 手写 render 函数。点击「打乱顺序」时，diff
      会通过 key 复用已有 DOM 节点，只移动而不重建（可在 Elements
      面板观察节点不被销毁重建）。
    </p>
    <div id="app"></div>

    <script type="module">
      // 导入应用创建、h 函数、响应式 API
      import { createApp, h, ref, reactive } from "../src/index.js";

      // ---- 定义一个组件，用 h() 手写 render 函数 ----
      const App = {
        /**
         * setup()：组件的初始化函数
         * 返回值会被 proxyRefs 包装，模板/render 中直接用 count 而非 count.value
         */
        setup() {
          // ref：包装原始值为响应式（通过 .value 读写）
          const count = ref(0);
          // reactive：包装数组为响应式（支持 sort、push、shift 等）
          const list = reactive([
            { id: "a", text: "苹果" },
            { id: "b", text: "香蕉" },
            { id: "c", text: "樱桃" },
            { id: "d", text: "西瓜" },
          ]);

          // 打乱数组顺序：触发 diff 算法的「移动」场景
          const shuffle = () => {
            list.sort(() => Math.random() - 0.5);
          };
          // 新增一项：触发 diff 算法的「新增」场景
          const addItem = () => {
            const id = Math.random().toString(36).slice(2, 6);
            list.push({ id, text: "新水果-" + id });
          };
          // 删除第一项：触发 diff 算法的「删除」场景
          const removeFirst = () => list.shift();

          return { count, list, shuffle, addItem, removeFirst };
        },
        /**
         * render(ctx)：组件的渲染函数
         * ctx 是渲染上下文，能访问 setupState 和 props（已自动解包 ref）
         *
         * 用 h(tag, props, children) 描述 UI 结构，
         * 运行时会将 h() 的返回值 (vnode) patch 到真实 DOM。
         */
        render(ctx) {
          return h("div", null, [
            // 计数器按钮：点击修改 ref，触发组件自动重渲染
            h("p", null, [
              h("button", { onClick: () => ctx.count++ }, `点击次数: ${ctx.count}`),
            ]),
            // 操作按钮
            h("p", null, [
              h("button", { onClick: ctx.shuffle }, "打乱顺序"),
              h("button", { onClick: ctx.addItem }, "新增一项"),
              h("button", { onClick: ctx.removeFirst }, "删除第一项"),
            ]),
            // 列表渲染：每个 item 都用 key 标识，
            // diff 时通过 key 精确匹配新旧节点，复用 DOM 而非重建
            h(
              "ul",
              null,
              ctx.list.map((item) =>
                h("li", { key: item.id }, `${item.id} - ${item.text}`)
              )
            ),
          ]);
        },
      };

      // ---- 创建应用并挂载到 #app ----
      // createApp(App) 创建应用实例，
      // .mount("#app") 将根组件包装成 vnode 并渲染到 DOM
      createApp(App).mount("#app");
    </script>
  </body>
</html>
