<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>④ 综合 TodoMVC · mini-vue</title>
    <style>
      body {
        font-family: -apple-system, "PingFang SC", sans-serif;
        max-width: 560px;
        margin: 40px auto;
        padding: 0 20px;
        color: #35495e;
      }
      h1 {
        color: #42b883;
      }
      .todo {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        background: #f6f8fa;
        border-radius: 8px;
        margin: 6px 0;
      }
      .todo.done span {
        text-decoration: line-through;
        color: #9aa7b3;
      }
      .todo span {
        flex: 1;
      }
      input[type="text"] {
        flex: 1;
        padding: 10px;
        border: 1px solid #ccd4dc;
        border-radius: 8px;
        font-size: 15px;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }
      button {
        background: #42b883;
        color: #fff;
        border: 0;
        padding: 8px 14px;
        border-radius: 6px;
        cursor: pointer;
      }
      button.del {
        background: #e07a5f;
      }
      .filters button {
        background: #fff;
        color: #35495e;
        border: 1px solid #ccd4dc;
      }
      .filters button.active {
        background: #42b883;
        color: #fff;
        border-color: #42b883;
      }
      .meta {
        font-size: 13px;
        color: #66788a;
        margin-top: 10px;
      }
      a {
        color: #42b883;
      }
    </style>
  </head>
  <body>
    <p><a href="../index.html">← 返回首页</a></p>
    <h1>④ TodoMVC</h1>
    <p>响应式 + 组件 + 虚拟 DOM diff 组合而成的完整小应用。</p>
    <div id="app"></div>

    <script type="module">
      // 导入完整 API：应用创建、h 函数、响应式、计算属性
      import {
        createApp,
        h,
        ref,
        reactive,
        computed,
      } from "../src/index.js";

      // ================================================================
      // 子组件：TodoItem —— 单条待办事项
      // 演示父子组件通信：props 向下传数据，emit 向上发事件
      // ================================================================
      const TodoItem = {
        /**
         * setup 直接返回 render 函数（简写形式）
         * @param props  父组件传入的属性（响应式）
         * @param emit   向父组件发射事件的函数
         */
        setup(props, { emit }) {
          return () =>
            h(
              "div",
              { class: props.todo.done ? "todo done" : "todo" },
              [
                // 复选框：点击触发 toggle 事件
                h("input", {
                  type: "checkbox",
                  checked: props.todo.done,
                  onChange: () => emit("toggle"),
                }),
                // 待办文本
                h("span", null, props.todo.text),
                // 删除按钮：点击触发 remove 事件
                h(
                  "button",
                  { class: "del", onClick: () => emit("remove") },
                  "删除"
                ),
              ]
            );
        },
      };

      // ================================================================
      // 根组件：App —— TodoMVC 主逻辑
      // ================================================================
      const App = {
        setup() {
          // ---- 响应式状态 ----
          const input = ref("");          // 输入框内容
          const filter = ref("all");      // 过滤条件：all | active | done
          const todos = reactive([        // 待办列表（响应式数组）
            { id: 1, text: "学习响应式原理", done: true },
            { id: 2, text: "理解虚拟 DOM diff", done: false },
            { id: 3, text: "手写模板编译器", done: false },
          ]);
          let uid = 4; // 自增 ID

          // ---- 计算属性：根据过滤条件筛选可见的待办 ----
          const visible = computed(() =>
            todos.filter((t) =>
              filter.value === "all"
                ? true
                : filter.value === "done"
                ? t.done
                : !t.done
            )
          );
          // 计算属性：未完成数量
          const remaining = computed(
            () => todos.filter((t) => !t.done).length
          );

          // ---- 操作函数 ----
          const add = () => {
            const text = input.value.trim();
            if (!text) return;
            todos.push({ id: uid++, text, done: false });
            input.value = "";
          };

          // 返回状态和函数（会被 proxyRefs 自动解包 ref）
          return { input, filter, todos, visible, remaining, add };
        },
        /**
         * render：用 h() 描述完整的 UI 结构
         * ctx 包含 setupState 中的所有属性（已解包 ref）
         */
        render(ctx) {
          // 辅助函数：创建过滤按钮
          const filterBtn = (key, label) =>
            h(
              "button",
              {
                class: ctx.filter === key ? "active" : "",
                onClick: () => (ctx.filter = key),
              },
              label
            );

          return h("div", null, [
            // ---- 输入区 ----
            h("div", { class: "row" }, [
              h("input", {
                type: "text",
                value: ctx.input,
                placeholder: "输入待办，回车添加…",
                onInput: (e) => (ctx.input = e.target.value),
                onKeydown: (e) => {
                  if (e.key === "Enter") ctx.add();
                },
              }),
              h("button", { onClick: ctx.add }, "添加"),
            ]),
            // ---- 过滤按钮组 ----
            h("div", { class: "filters row" }, [
              filterBtn("all", "全部"),
              filterBtn("active", "未完成"),
              filterBtn("done", "已完成"),
            ]),
            // ---- 待办列表：每项是一个 TodoItem 组件 ----
            // 通过 key 让 diff 正确复用/移动 DOM 节点
            // onToggle/onRemove 是父组件传入的事件处理器
            h(
              "div",
              null,
              ctx.visible.map((todo) =>
                h(TodoItem, {
                  key: todo.id,
                  todo,
                  onToggle: () => (todo.done = !todo.done),
                  onRemove: () => {
                    const i = ctx.todos.findIndex((t) => t.id === todo.id);
                    if (i > -1) ctx.todos.splice(i, 1);
                  },
                })
              )
            ),
            // ---- 统计信息 ----
            h("p", { class: "meta" }, `还剩 ${ctx.remaining} 项未完成`),
          ]);
        },
      };

      // ---- 创建应用并挂载 ----
      createApp(App).mount("#app");
    </script>
  </body>
</html>
